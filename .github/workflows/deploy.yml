# THE DEPLOY. A merge to main deploys (Dustin 2026-09-23): after CI concludes success on a push to main, this ships
# that commit, through devkit's worker-deploy.yml, as the network's other Worker sites do. worker-deploy reads the D1
# Time Travel bookmark, runs the pre-deploy guard below (config ids, queues, additive migrations, the content's source
# from D1, the build), deploys with DEPLOY_SHA set, waits for /health to report this commit, runs
# scripts/verify-deploy.mjs, and rolls the Worker back when it refuses. Its limits are devkit's README, "The shared
# deploy": a rollback swaps code and bindings, never a migration; that is the bookmark's restore command, in the summary.
#
# Then `converge` (scripts/converge.mjs) brings the deployed site's data and helpers into step: the watchdog, the
# uptime monitors, the D1 sync, the Ask index, the CV PDF, the share cards and the media index, then the browser test.
# A converge miss leaves the deploy standing and fails the run. `mcp` ships the admin MCP the same way as the site.
#
# THE SWITCH. `gh variable set AUTO_DEPLOY --body off` stops the automatic and scheduled runs; any other value, or
# none, turns them back on. A dispatch from main deploys either way.
#
# SECRETS. CLOUDFLARE_API_TOKEN (a scoped token: the Edit Cloudflare Workers template plus Account, D1, Edit, on this
# account only; never the global API key) and CLOUDFLARE_ACCOUNT_ID reach worker-deploy. The redacted config values
# come from the live Workers' own bindings (scripts/apply-config-ids.mjs), so no id is a secret. OPERATOR_TOKEN is the
# converge job's only other one.

name: Deploy

on:
  workflow_dispatch:
  # After CI finishes on main. `decide` turns this into a deploy only when CI succeeded on a push to main, AUTO_DEPLOY
  # is not "off", and the commit is still main's tip.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # The content's source is D1 (scripts/lib/content-source.mjs), so a Carrel save starts no CI run. The header's facts,
  # the footer's pages, the sitemap dates and a new post's card are build products, so main's tip ships again every six
  # hours to rebuild them from D1.
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

# Queue, never race, and never cancel a deploy in flight: a half-run deploy, sync and index convergence is the state
# that must not happen.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # worker-deploy deploys github.sha, which on every trigger here is main's tip. So `decide` deploys only when the
  # commit CI passed is that tip; a newer merge has its own CI run, which deploys it.
  decide:
    name: Decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          AUTO_DEPLOY: ${{ vars.AUTO_DEPLOY }}
        run: |
          set -euo pipefail
          skip() { echo "Not deploying: $1"; echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0; }
          go() { echo "$1"; echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$REF" = "refs/heads/main" ] || { echo "::error::Dispatch from main. ${REF} is not what ships."; exit 1; }
            go "Dispatched; deploying main's tip ${SHA}."
          fi
          [ "$AUTO_DEPLOY" != "off" ] || skip "AUTO_DEPLOY is off. Deploy by hand with: gh workflow run deploy.yml --ref main"
          [ "$EVENT" != "schedule" ] || go "Scheduled rebuild of main's tip ${SHA} from D1's content."
          [ "$CI_CONCLUSION" = "success" ] || skip "CI concluded ${CI_CONCLUSION} on ${CI_SHA}."
          [ "$CI_EVENT" = "push" ] || skip "CI ran for a ${CI_EVENT}, not a push to main."
          [ "$CI_BRANCH" = "main" ] || skip "CI ran on ${CI_BRANCH}, not main."
          [ "$CI_SHA" = "$SHA" ] || skip "${CI_SHA} is no longer main's tip (${SHA}); that commit's own CI deploys it."
          go "CI passed on main's tip ${SHA}; deploying it."

  site:
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@0c1b0a6aa70b7991888cc2d5686af6e8a8e28f3d # v0.21.3
    with:
      worker-name: dustinedwards
      d1-database: dustinedwards
      health-url: https://dustinedwards.info/health
      sha-var: DEPLOY_SHA
      verify-command: node scripts/verify-deploy.mjs
      # The config's redacted values, any new queue, the additive migrations, then the build from D1's content (a path
      # D1 has never held is seeded from the repository first).
      pre-deploy: >-
        node scripts/apply-config-ids.mjs
        && node scripts/ensure-queues.mjs wrangler.jsonc
        && npx devkit-migrations drizzle --apply dustinedwards
        && node scripts/seed-sources.mjs --remote
        && node scripts/pull-sources.mjs --remote
        && npm run build:stack
        && npm run build:content
        && npm run build
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  converge:
    name: Converge
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `actions: write` dispatches browser.yml against the deploy, converge's last step.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Put the redacted values into the wrangler configs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/apply-config-ids.mjs
      # converge reads the operator token from the file OPERATOR_TOKEN_FILE names; `printf %s`, so the file holds the
      # token and nothing else.
      - name: Stage the operator token
        env:
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$OPERATOR_TOKEN" ] || { echo "::error::The OPERATOR_TOKEN secret is not set, so nothing can be synced."; exit 1; }
          printf '%s' "$OPERATOR_TOKEN" > "$RUNNER_TEMP/operator-token"
          chmod 600 "$RUNNER_TEMP/operator-token"
      - name: Converge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPERATOR_TOKEN_FILE: ${{ runner.temp }}/operator-token
          GH_TOKEN: ${{ github.token }}
        run: node scripts/converge.mjs
      # Every sitemap page fetched once, so its first reader gets a stored page. It never fails the job.
      - name: Warm the stored pages
        run: npx devkit-warm https://dustinedwards.info
      - name: Remove the staged token
        if: always()
        run: rm -f "$RUNNER_TEMP/operator-token"

  # After the site it binds (SITE is a service binding). Its config is gitignored, so it is rebuilt from the tracked
  # example and the live Worker's own bindings (scripts/apply-mcp-config.mjs).
  mcp:
    needs: site
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@0c1b0a6aa70b7991888cc2d5686af6e8a8e28f3d # v0.21.3
    with:
      worker-name: dustinedwards-admin-mcp
      working-directory: mcp
      install: npm ci
      pre-deploy: node ../scripts/apply-mcp-config.mjs
      health-url: https://admin-mcp.dustinedwards.info/health
      sha-var: DEPLOY_SHA
      verify-command: node ../scripts/verify-mcp.mjs
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
