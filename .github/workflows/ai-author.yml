name: ai-author

# No AI trailer and no AI author on new commits. The check is devkit's, pinned by full sha; it runs the bin from the
# @dustinedwards/devkit tag package.json pins. A gate: it fails the run (ruling in devkit's README).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to the default branch never does.
concurrency:
  group: ai-author-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ai-author:
    uses: DrDustinEdwards/devkit/.github/workflows/ai-author.yml@d9d5a3448a50f183c3c8b4a5f293717728717245 # v0.20.8
