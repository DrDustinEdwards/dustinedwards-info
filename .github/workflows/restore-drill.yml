# The restore drill: devkit's shared drill restores the newest complete nightly run in
# dustinedwards-backups into a scratch SQLite file and checks the copy (d1-dump's `drill --bucket`),
# then restores a sample of the files backups and checks their bytes. devkit-ops-audit's R1 reads
# this workflow's newest run.

name: Restore drill

on:
  schedule:
    # WEEKLY, Sunday 04:23 UTC. Off the hour so it does not queue behind the
    # crowd of on-the-hour jobs GitHub schedules for every repository at once,
    # and on a Sunday because a failure is a thing to read on Monday rather
    # than an interruption.
    - cron: "23 4 * * 0"
  # So it can be run on demand after touching the backup path, which is when
  # you actually want to know, rather than up to a week later.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    uses: DrDustinEdwards/devkit/.github/workflows/restore-drill.yml@250d737c13b6f4c74987652818d262cb1d1c9cf7 # v0.27.0
    with:
      bucket: dustinedwards-backups
      d1-dump-ref: v0.8.0
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
