name: access-drift

# The daily Access drift check (devkit's access-drift.yml, area 3 I2): who dustinedwards-login lets in, against
# ADMIN_EMAILS, read hashed from /admin/access-drift.
# It fails until ACCESS_READ_TOKEN, CLOUDFLARE_ACCOUNT_ID, ACCESS_CLIENT_ID and ACCESS_CLIENT_SECRET are set, by design.

on:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    uses: DrDustinEdwards/devkit/.github/workflows/access-drift.yml@0c1b0a6aa70b7991888cc2d5686af6e8a8e28f3d # v0.21.3
    with:
      app: dustinedwards-login
      admins-url: https://dustinedwards.info/admin/access-drift
      site-runtime-ref: v0.59.0
    secrets:
      ACCESS_READ_TOKEN: ${{ secrets.ACCESS_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
      ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
