# THE SECOND, SLOWER OPINION. OFF-PLATFORM, AND SINCE 2026-08-29 NO LONGER THE
# PRIMARY WATCHER.
#
# ## WHAT THIS FILE NOW IS
#
# `workers/watchdog.ts` is a Worker on this Cloudflare account with a Cron
# Trigger every fifteen minutes. It polls the same endpoint, drives the same
# repairs through the same operator door, and mails on the same conditions.
# This workflow runs HOURLY and is kept for exactly one property the watchdog
# cannot have: it speaks from OUTSIDE Cloudflare.
#
# That property got SHARPER rather than weaker when the watchdog landed.
# MEASURED 2026-08-29: a Worker cannot make an ordinary HTTPS request to this
# site at all. A global `fetch()` to the site's own URL answers 404 with
# Cloudflare error 1042, the Worker-to-Worker-on-one-zone restriction, while a
# control fetch to example.com returns 200. So the watchdog reaches the site
# through a SERVICE BINDING, which invokes the Worker directly.
#
# **The watchdog therefore proves the health suite RUNS. It does not prove the
# site is REACHABLE.** A broken Worker route, a bad DNS answer, or an edge fault
# with a perfectly healthy Worker behind it is invisible to the watchdog and
# visible only here. This job is the whole of that coverage, and its cadence is
# the bound on how long such a fault can hide: about an hour. The DNS cutover
# retires the gap, because a Custom Domain is the documented way one Worker may
# fetch another, and the watchdog can then make a real request.
#
# ## WHY IT IS NO LONGER EVERY FIFTEEN MINUTES
#
# Because it was not running. MEASURED 2026-08-28 over the run history: against
# 96 expected firings a day the schedule fired 38 times on 08-23 and 2 times on
# 08-28. Every run that fires succeeds; the daily browser cron decays the same
# way. Note (2) below predicted this in prose and note (1) explains why it is
# invisible. Self-repair was effectively not running, and the inbox looked
# exactly as it does when everything is fine.
#
# Hourly is an honest request rather than a fiction. It also stops the two
# watchers polling together, which would double the load on a rate-limited
# endpoint for no extra coverage. Keep this workflow SLOWER than the watchdog
# rather than a duplicate of it.
#
# ## THE EMAIL IS UNCHANGED AND IS STILL THE DELIVERY MECHANISM
#
# A failing run here IS the alert. GitHub emails the repository owner when a
# SCHEDULED workflow run fails, by default, and that is the entire delivery
# mechanism: no notification service and no webhook. It was chosen because it is
# free, already configured, and lives OUTSIDE Cloudflare, so it still speaks
# when the Worker it watches is broken. The watchdog mails through Cloudflare
# Email Sending instead, which is the right tool for a Worker and is also inside
# the failure domain this job exists outside of.
#
# What it catches: the site not answering at all, and any health check failing.
# That covers the 31 July incident, where the Ask index lost nine records and
# nobody knew for three weeks because the only surface saying so was a badge on
# a page somebody had to open.
#
# ## IT STILL REPAIRS THE CLASSES IT CAN, BEFORE IT WAKES ANYBODY
#
# Unchanged, and it shares its decision module with the watchdog:
# `app/lib/health/repair.mjs`, which moved out of `scripts/lib/` when the
# watchdog became its second caller. Two copies of the table that decides
# whether an unattended write fires would be rule 17 in the most expensive place
# available.
#
# An unhealthy run consults a repair plan, performs what it allows, re-polls
# once, and fails only if that did not work or the failing class is one nobody
# has classified.
#
# **THIS WORKFLOW TAKES ONE SECRET, `OPERATOR_TOKEN`.** Without it the run still
# polls, still alerts, and SAYS in the log that self-repair is disabled; it does
# not silently become a plain monitor again. Set it once with:
#
#     gh secret set OPERATOR_TOKEN < <path to the operator token file>
#
# THERE ARE NOW THREE HOLDERS OF THAT VALUE: this repository secret, the site
# Worker, and the watchdog Worker. Rotation touches all three, and CLAUDE.md's
# bindings section carries the note.
#
# The decision about whether to repair is deliberately NOT in this file. See the
# comment at the call site.
#
# ============================ WHAT IT DOES NOT CATCH =========================
#
# Read this before treating a quiet inbox as good news.
#
# 1. **A STOPPED SCHEDULE IS A SILENT FAILURE.** GitHub disables scheduled
#    workflows on repositories with no activity for 60 days, and it does so
#    QUIETLY. Nothing here can detect that, because the thing that would report
#    it is the thing that stopped. A repository that goes two months without a
#    commit is a repository whose monitor has switched itself off and left the
#    inbox looking exactly as it does when everything is fine. There is no fix
#    inside this file; the mitigation is that this repo is active, and the
#    residual risk is accepted rather than solved. **The watchdog now carries
#    most of the cost of this**, which is a large part of why it exists.
#
# 2. **Scheduled runs are best effort and are often late.** GitHub queues them
#    and drops them under load. An hourly cadence is a request, not a promise,
#    and a missed run is invisible for the same reason as (1). This note used to
#    say fifteen minutes and it was correct; the measurement above is what
#    believing it anyway cost.
#
# 3. **The email depends on the owner's notification settings.** If Actions
#    notifications are off, the run still fails and nobody is told.
#
# 4. It sees only what /api/health measures: the two index reconciliations, the
#    R2 trip-wire and the FTS equalities. Not layout, not the admin plane, not
#    the bill, and not whether a page renders correctly to a reader.
#
# 5. **SELF-REPAIR CAN MASK A RECURRING FAULT.** A drift that returns every
#    interval is now repaired every interval, silently, and the inbox stays
#    quiet. The run log records each repair, and nothing reads those logs on a
#    schedule. Accepted rather than solved: the alternative is alerting on a
#    condition that has already been fixed, which is the noise that gets
#    monitors muted. If a repair ever becomes routine, that is the signal to
#    find why the source and its projection keep parting company.
#
# 6. **THE WATCHDOG AND THIS JOB CAN BOTH REPAIR, AND THEY DO NOT COORDINATE.**
#    Accepted rather than solved, because every operation behind the repair door
#    is idempotent and derives its own converged verdict, so two callers running
#    the same derivation converge on the same state. The cadences differ by four
#    times, so an overlap is rare, and the cost of one is a duplicate write that
#    changes nothing.
#
# ============================================================================
#
# Actions are pinned BY COMMIT SHA, not by tag. A tag is a moving pointer the
# upstream owner can repoint at any commit, so `@v4` is "whatever that account
# publishes next" running with this repository's token. The audit named this in
# section 8 about ci.yml, which is fixed in the same commit as this file.

name: Health

on:
  schedule:
    # HOURLY, since 2026-08-29. The watchdog Worker owns the fifteen-minute
    # poll; this is the off-platform second opinion and is deliberately
    # slower. Minute 17 rather than 0 so it does not queue behind the crowd of
    # on-the-hour jobs GitHub schedules for every repository at once, which is
    # the documented worst case for the lateness note (2) describes.
    - cron: "17 * * * *"
  # So the switch can be tested without waiting for, or editing, the schedule.
  workflow_dispatch:

# Read-only. This workflow needs no write scope on anything, and a token that
# cannot write is one that cannot be turned against the repository if a pinned
# action is ever compromised anyway.
permissions:
  contents: read

# A late run must not stack on a running one, and cancel-in-progress is false
# for the same reason ci.yml sets it false: cancelling loses the only record
# that a check was ever made.
concurrency:
  group: health
  cancel-in-progress: false

jobs:
  poll:
    name: Poll /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # actions/checkout v7.0.1, pinned to the commit that tag pointed at on
      # 2026-08-23. Bumped from the v4 pin because GitHub is retiring the Node 20
      # runner and that pin targeted it; every run was printing a deprecation
      # warning and being forced onto Node 24 anyway. v7.0.1 declares node24
      # itself, which was checked in its action.yml rather than assumed.
      #
      # Needed because the ORIGIN is READ OUT OF THE REPO below rather than
      # written here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Poll the health endpoint
        run: |
          set -euo pipefail

          # THE ORIGIN IS DERIVED, NOT WRITTEN HERE, and that is the whole
          # reason this job checks out the repository. `app/lib/seo.ts` states
          # SITE_ORIGIN once and everything else derives from it. A URL typed
          # into this file would be a second copy, and it would go stale on
          # exactly one day: the DNS cutover, when the origin changes and this
          # monitor would silently start polling an address nobody serves any
          # more while reporting green.
          ORIGIN=$(sed -n 's/.*export const SITE_ORIGIN = "\([^"]*\)".*/\1/p' app/lib/seo.ts)
          if [ -z "$ORIGIN" ]; then
            echo "::error::Could not read SITE_ORIGIN from app/lib/seo.ts."
            echo "The declaration moved or was renamed, so this job does not know what to poll."
            exit 1
          fi
          echo "Polling ${ORIGIN}/api/health"

          # The status code is captured with -w into a variable. It is NOT read
          # through a pipe: a pipeline reports the exit status of its LAST
          # command, so `curl ... | jq` would report jq's success and hide a
          # failed request entirely.
          #
          # --max-time bounds the whole request. Without it a hung endpoint
          # would hold the runner until the job timeout, which reports as a
          # cancelled run rather than as a failed check.
          STATUS=$(curl --silent --show-error --max-time 30 \
            --output body.json --write-out '%{http_code}' \
            "${ORIGIN}/api/health" || echo "000")

          echo "HTTP ${STATUS}"
          echo "--- body ---"
          cat body.json || true
          echo ""
          echo "------------"

          # A body that does not parse is a failure in its own right. It means
          # something answered that is not this endpoint: an error page, an
          # interception, a proxy. Checked BEFORE the status so the log says
          # which of the two went wrong.
          if ! jq --exit-status . body.json > /dev/null 2>&1; then
            echo "::error::The health endpoint did not return parseable JSON (HTTP ${STATUS})."
            exit 1
          fi

          # Every failing check by name AND WITH ITS TWO COUNTS, into an
          # ::error:: annotation, because the annotation is what reaches the
          # notification EMAIL. The whole body is printed above, but nobody
          # reads a run log they have not been given a reason to open.
          #
          # The 17:15Z flap on 2026-08-23 is the reason: ask-index-drift went
          # false, recovered by itself, and could not be triaged, because
          # "which check failed" was all anyone had. One record apart during a
          # rebuild and a hundred apart are the same alert, and only one of
          # them is an incident.
          #
          # A failing check now carries expected and present; a passing one
          # still carries name and ok only. The `.expected != null` arm keeps
          # this working against the OLD body shape rather than turning a real
          # failure into a jq error, which was checked against both shapes.
          FAILED=$(jq --raw-output '[.checks[]? | select(.ok == false) | .name + (if .expected != null then " (expected " + (.expected|tostring) + ", present " + (.present|tostring) + ")" else "" end)] | join("; ") // empty' body.json)
          if [ -n "$FAILED" ]; then
            echo "::error::Failing checks: ${FAILED}"
          fi

          # A healthy run stops here. Everything below is the unhealthy path.
          if [ "$STATUS" = "200" ] && [ "$(jq --raw-output '.ok' body.json)" = "true" ]; then
            echo "Healthy."
            exit 0
          fi

          # ================= SELF-REPAIR, THEN ONE RE-POLL ====================
          #
          # Ruled 2026-08-24 under the AUTOMATE directive. Two of the checks
          # here describe a DERIVED store that has drifted from its source, and
          # both have a repair that runs through the front door: the same
          # operator operations `ship` calls, which are the same derivations the
          # admin buttons call. An alert whose only remedy is a human running
          # the command the machine could have run is a chore.
          #
          # WHAT IS NOT AUTOMATED: deciding what to do about a class nobody has
          # classified. `app/lib/health/repair.mjs` refuses to repair
          # anything when an unknown check is failing, including the known ones
          # failing beside it, and the run fails so a person reads it.
          #
          # THE DECISION IS NOT IN THIS FILE, deliberately. Bash inside YAML on
          # a schedule is the least testable code in this repository, and this
          # decides both whether to perform an authenticated write and whether
          # to wake somebody. It lives in a module `check:tests` drives.
          #
          # A NON-200 IS PASSED THROUGH THE SAME PATH rather than exiting here,
          # because a 503 IS how this endpoint reports a failing check: exiting
          # on the status alone would mean the repair never ran for the exact
          # responses it exists for. A body that named no failing check is
          # alert-only, so a genuine outage still wakes somebody.
          echo "Unhealthy (HTTP ${STATUS}). Consulting the repair plan."

          if [ -z "${OPERATOR_TOKEN:-}" ]; then
            # STATED, not silent. A monitor that quietly lost the ability to act
            # looks exactly like one that never needed to.
            echo "OPERATOR_TOKEN is not set on this workflow: self-repair is DISABLED and this run is alert-only."
            echo "Set it once with: gh secret set OPERATOR_TOKEN < <path to the operator token file>"
          fi

          # Node is on the runner image; no setup-node step and no install. The
          # script imports two local modules and uses fetch, which is built in.
          node scripts/health-repair.mjs --origin "$ORIGIN" --body body.json
        env:
          # Absent secret resolves to the empty string, which the script reports
          # as a named configuration state rather than as a failed repair.
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
