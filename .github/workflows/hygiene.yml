# The no-bloat measurements, run on every pull request and every push to main, and NEVER a gate.
#
# Knip (dead code), jscpd (duplication) and the gzip weight of every route (scripts/measure-route-weight.mjs) each write
# their numbers to the run's summary. Every step is `continue-on-error`, so a finding or a crashed tool is reported and
# never turns a pull request red: a number that has never been acted on is information, not a rule (baseline.md in
# Capsid, dustinedwards/baseline.md, Part 2a). Knip and jscpd are run through npx at the major the baseline measured;
# neither is a dependency of the site.

name: Hygiene

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  report:
    name: Dead code, duplication and route weight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Nothing in this workflow may turn a pull request red, including the install and the generate step.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The generated files the app imports (content/generated/*), built as ci.yml builds them, local only. Without them
      # Knip reports them missing and the build cannot start.
      - name: Generate
        run: |
          npx wrangler d1 migrations apply dustinedwards --local
          npm run build:stack
          npm run build:content

      - name: Knip
        continue-on-error: true
        run: |
          {
            echo '### Knip (dead code)'
            echo '```'
            npx --yes knip@6 --no-progress || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: jscpd
        continue-on-error: true
        run: |
          {
            echo '### jscpd (duplication)'
            echo '```'
            npx --yes jscpd@4 app workers scripts --min-lines 8 --min-tokens 80 --silent --reporters console --ignore "**/node_modules/**,**/build/**,**/*.d.ts,**/fixtures/**,**/*.md,**/*.json" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Route weight
        continue-on-error: true
        run: |
          # A tool that could not run is a warning on the run, not a silent pass: continue-on-error alone hides it.
          if npm run build && node scripts/measure-route-weight.mjs > weight.txt; then
            {
              echo '### Weight per route (gzip JS and CSS)'
              echo '```'
              cat weight.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the route weight report could not run; see this step's log"
            exit 1
          fi
