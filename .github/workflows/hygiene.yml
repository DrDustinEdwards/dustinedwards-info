# The route weight, run on every pull request and every push to main, and NEVER a gate.
#
# The gzip weight of every route (devkit-route-weight, set by .route-weight.json) writes its numbers to the run's
# summary. Every step is `continue-on-error`, so a finding or a crashed tool is reported and never turns a pull request
# red: a number that has never been acted on is information, not a rule. Knip and jscpd are no-bloat.yml.

name: Hygiene

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  report:
    name: Route weight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Nothing in this workflow may turn a pull request red, including the install and the generate step.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The generated files the app imports (content/generated/*), built as ci.yml builds them, local only. Without them
      # the build cannot start.
      - name: Generate
        run: |
          npx wrangler d1 migrations apply dustinedwards --local
          npm run build:stack
          npm run build:content

      - name: Route weight
        continue-on-error: true
        run: npm run build && npx devkit-route-weight
