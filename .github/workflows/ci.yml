# The review that is not the author.
#
# Audit 2.1: "the gates are the review" was one person grading their own
# homework with a rubric they wrote, on a machine that already had node_modules,
# generated types and a real wrangler.jsonc. This runs the same rubric on a
# machine that has none of that.
#
# WHAT THE CLEAN CHECKOUT ACTUALLY REVEALED, measured 2026-08-20 by extracting
# HEAD, running `npm ci` in it and running the offline tier there: 22 passed,
# 4 failed. `npm ci` needs no Cloudflare credentials, because `postinstall`
# runs `devkit-bootstrap` (copy the example, then wrangler types), which writes a wrangler.jsonc
# from the tracked example and generates worker-configuration.d.ts locally. So
# CI reaches a typechecking state with no secrets at all, and this workflow
# declares none.
#
# What a clean checkout cannot run is excluded in CI_EXCLUDED in
# scripts/check-all.mjs, each with its reason.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The daily system-model refresh (system-model.yml) opens its pull request with GITHUB_TOKEN, and
  # GitHub starts no workflow from that token's events but a dispatch. So that workflow dispatches
  # this one on its branch, and the checks land on the pull request's head like any other run.
  workflow_dispatch:

# A second push to main should not race the first, and ON MAIN
# `cancel-in-progress` stays false: the runs are the review, and cancelling one
# loses the only record that a commit was ever checked.
#
# On every OTHER ref it is true. A pull request branch that is pushed again, or
# rebased by Renovate, has its superseded run cancelled, because the run that is
# anybody's review there is the one against the head that merges. Measured
# 2026-09-15: Renovate branches re-ran this workflow 20 to 37 times each and
# cost 602 Actions minutes in the September cycle, while this repository was
# still private and drew on the account's 2,000 private minutes. The cause was
# Renovate rebasing every open branch whenever main moved, fixed the same day
# by rebaseWhen "conflicted" in devkit's shared Renovate policy. The repository
# is public now, and public repositories run Actions free (Dustin, 2026-10-06,
# D6 of capsid/research/design-shared-tests.md); the cancellation stays because
# a superseded run reviews nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gates:
    name: Gates, clean checkout
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # No fetch-depth override: a full history buys this workflow nothing.
      # PINNED BY COMMIT SHA, not by tag. A tag is a moving pointer the upstream
      # owner can repoint at any commit, so a tag ref means "whatever that
      # account publishes next" running with this repository's token. Audit
      # section 8. This sha is the commit the actions/checkout v7.0.1 tag named
      # when it was verified against the tag list on 2026-08-25; the comment
      # here used to say v4, which was false about its own sha and is exactly
      # the mislabel that gets a pin "restored" to the wrong release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The version is READ FROM .nvmrc rather than written here. A second
      # statement of the Node version is a mirror, and this repo has been bitten
      # by mirrors twice this month; .nvmrc is the one place that names it, and
      # this comment used to name it too, which is the mirror it warns about.
      # The sha the actions/setup-node v7.0.0 tag named, verified against the
      # tag list 2026-08-25, pinned for the same reason.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` and not `npm install`: it installs from the lockfile exactly and
      # fails if package.json and the lockfile disagree, which is the property
      # that makes this a review rather than a re-resolution.
      #
      # postinstall runs here and provisions wrangler.jsonc plus the generated
      # types. If that ever needs credentials, this step is where it will fail
      # loudly rather than silently degrading a later gate.
      - name: Install
        run: npm ci

      # THE LOCAL STATE THE GATES READ, built rather than checked out. Since
      # the artifact arc, content/generated/posts.json is a gitignored build
      # product (git holds markdown; D1 holds the rendered copy), so a
      # checkout has markdown and no corpus. The migrations and the local
      # sync give the runner the same shape the deploy runner builds: a local
      # D1 whose schema is what drizzle/ declares, with the content in it.
      # `--local` only; nothing here can reach the deployed database, and
      # this workflow still declares no secrets.
      #
      # The order is load-bearing: migrations build the schema, build:stack
      # emits the colophon artifact build:content reads, build:content renders
      # the corpus, sync reads what build:content wrote. The enhancement
      # bundles are not a step: the app build emits them itself.
      #
      # content/generated/stack.json is derived here rather than committed, so
      # a dependency PR is judged on its dependency.
      - name: Migrations, stack and content build, local sync
        run: |
          npx wrangler d1 migrations apply dustinedwards --local
          npm run build:stack
          npm run build:content
          npm run sync:content -- --local

      # ONE COMMAND, derived. The tier is the offline tier minus CI_EXCLUDED,
      # computed in check-all.mjs from package.json, so a gate added tomorrow is
      # in CI by default and has to be argued OUT rather than remembered IN.
      # Listing gate names here would be the mirror that lets the next one be
      # forgotten, which is the exact failure that file exists about.
      #
      # The typecheck is inside this tier as check:types since 2026-08-20, so a
      # build that does not compile fails CI without a separate step.
      # LINT, and it is deliberately NOT a `check:` script.
      #
      # `check-all.mjs` derives the gate list from package.json and refuses to
      # run a gate nobody has tiered, so naming this `check:lint` would enrol it
      # in the offline tier and in ship. That is a bigger claim than it earns:
      # oxlint reads style and dead code, it proves nothing about behaviour, and
      # a deploy should not be blocked by a preference. CI is where a preference
      # belongs, because CI is the review the author is not.
      #
      # `--deny-warnings`, so the clean state stays clean: everything it found
      # on the day it landed was fixed rather than allowlisted, and a warning
      # tolerated once is a warning nobody reads again.
      - name: Lint
        run: npm run lint

      - name: Gates
        run: npm run check:ci

      # The app build, so a change that typechecks but does not build fails
      # here rather than at deploy. check:ci built its three prereqs a moment
      # ago, so only the app build is left. The build needs no secrets: the
      # Cloudflare plugin starts its remote-binding proxy (AI_SEARCH, IMAGES)
      # for dev and preview only.
      - name: Build
        run: npm run build

  # THE ADMIN MCP, mcp/ (Dustin Edwards Admin), moved here from its own repo on 2026-10-10 with
  # the CI it had there. Its own job because it is its own package: its own lockfile, its own SDK
  # and OAuth versions, its own Worker. Run on every push rather than on a path filter, so CI's
  # verdict for a sha always covers mcp/ and `npm run ship:mcp` can require it.
  #
  #   typecheck            wrangler types plus tsc -b, the folder's src and the one app module
  #                        it imports (app/lib/health/repair.mjs)
  #   check:wrapper        the no-policy law and the security floor, read off the real source,
  #                        the config, and the site's operator tool list
  #   check:wrapper:plant  that the gate above actually fails, one planted violation at a time
  #   test                 the tools, ownership, scope, the log and registration, against a fake site
  #   build                a dry-run bundle: typecheck is not a build
  mcp:
    name: Admin MCP, clean checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci

      # wrangler.jsonc is gitignored (it carries the live KV ids), and `wrangler types` and the
      # build read it, so the runner builds from the example's placeholders. `cp -n` never
      # overwrites. The plant harness edits it and restores it.
      - name: Bootstrap wrangler.jsonc from the example
        run: |
          cp -n wrangler.jsonc.example wrangler.jsonc

      - run: npm run typecheck
      - run: npm run check:wrapper
      - run: npm run check:wrapper:plant
      - run: npm test
      - run: npm run build
