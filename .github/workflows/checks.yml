name: checks

# Every pull request check in one job (devkit's pr.yml, README "One job per pull request"): the "Generated by Claude Code"
# footer removed from pull request descriptions, no AI trailer or author on new commits, the shared-code check, OSV-Scanner
# in pull request mode, actionlint and zizmor when the change touches .github/, Knip and jscpd against .no-bloat.json, the
# bundle size of each Worker this repository deploys (the site and the admin MCP, each against its .worker-size.json),
# and the advisory reviewer. Exceptions to the shared-code check are in .shared.json with their reasons. What is shared:
# https://github.com/DrDustinEdwards/devkit/blob/shared-list/SHARED.md
#
# No push to main: the merge was checked as a pull request (devkit README, "No second run on main"). deploy.yml reads
# only CI's own run on main (ci.yml), never this check. Run it by hand once to clean the footer from every past pull
# request.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
  # Once a day on the default branch: the shared-code check judges the repository's state there, which a pull request's
  # run leaves to it (devkit pr.yml, "THE CALLER"). A red run is Capsid's job for this repository.
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The pull request is the group, so a newer push cancels the older run.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id is `checks`, so the check is "checks / Repo checks", the name the ruleset requires.
  checks:
    # A called workflow holds no more than this job grants: the footer writes the description, the reviewer signs in to
    # Capsid with the job's OIDC token and writes its check.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      checks: write
    uses: DrDustinEdwards/devkit/.github/workflows/pr.yml@7e96e225efdd6e0b161f89825afb1b5c4a910478 # v0.48.1
    with:
      review: true
      # The generated files the app imports, built as ci.yml builds them, local only. typegen writes the routes'
      # +types modules, which knip otherwise reports as unresolved imports.
      no-bloat-prepare: |
        npx react-router typegen
        npx wrangler d1 migrations apply dustinedwards --local
        npm run build:stack
        npm run build:content
      # The admin MCP FIRST: mcp/ has its own lockfile, devkit and wrangler, and a gitignored config rebuilt from its
      # example (`cp -n` never overwrites). It runs before the site because the site's build writes the Vite plugin's
      # redirect, .wrangler/deploy/config.json, at the root, and wrangler run in mcp/ then refuses to choose between
      # it and mcp/wrangler.jsonc. The site: the app build, as ci.yml builds it; its dry run follows that redirect to
      # build/server.
      workers: >-
        [{ "name": "mcp", "working-directory": "mcp", "prepare": "npm ci --prefix mcp && cp -n mcp/wrangler.jsonc.example mcp/wrangler.jsonc" },
         { "name": "site", "prepare": "npx wrangler d1 migrations apply dustinedwards --local && npm run build:stack && npm run build:content && npm run build" }]
