name: worker-size

# The bundle size budget of each Worker this repository deploys: the site, the watchdog and the admin MCP. A dry run's Total
# Upload over the budget in its .worker-size*.json fails. The workflow is devkit's, pinned by full sha; no secret is needed.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worker-size-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  site:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@00667358d7a72f07f92504dea30b4ffa318a8f46 # v0.20.12
    with:
      # The app build, as ci.yml builds it; the dry run then follows the Vite plugin's redirect to build/server.
      prepare: |
        npx wrangler d1 migrations apply dustinedwards --local
        npm run build:stack
        npm run build:content
        npm run build

  watchdog:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@00667358d7a72f07f92504dea30b4ffa318a8f46 # v0.20.12
    with:
      config: .worker-size.watchdog.json

  mcp:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@00667358d7a72f07f92504dea30b4ffa318a8f46 # v0.20.12
    with:
      # devkit's bin comes from the root install; mcp/ has its own lockfile and wrangler.
      install: npm ci --ignore-scripts && npm ci --prefix mcp
      prepare: cp -n mcp/wrangler.jsonc.example mcp/wrangler.jsonc
      working-directory: mcp
