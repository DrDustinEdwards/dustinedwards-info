name: no-bloat

# Knip and jscpd against the baseline in .no-bloat.json: a count above it fails. Lower it with
# `npx devkit-no-bloat --write-baseline` when a count goes down. The workflow is devkit's, pinned by full sha. The route
# weight stays in hygiene.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: no-bloat-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  no-bloat:
    uses: DrDustinEdwards/devkit/.github/workflows/no-bloat.yml@d9d5a3448a50f183c3c8b4a5f293717728717245 # v0.20.8
    with:
      # The generated files the app imports, built as ci.yml builds them, local only. typegen writes the routes'
      # +types modules, which knip otherwise reports as unresolved imports.
      prepare: |
        npx react-router typegen
        npx wrangler d1 migrations apply dustinedwards --local
        npm run build:stack
        npm run build:content
