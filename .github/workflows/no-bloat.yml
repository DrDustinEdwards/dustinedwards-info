name: no-bloat

# Knip and jscpd against the baseline in .no-bloat.json. Warn-only: it never turns a pull request red, because a finding
# nobody has acted on is information, not a rule. The workflow is devkit's, pinned to the v0.5.0 commit. The route weight stays in
# hygiene.yml, beside this one.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: no-bloat-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  no-bloat:
    uses: DrDustinEdwards/devkit/.github/workflows/no-bloat.yml@491b6cc552a80cdfcb4c0b5184e51682f907eda3 # v0.6.0
    with:
      # The generated files the app imports, built as ci.yml builds them, local only.
      prepare: |
        npx wrangler d1 migrations apply dustinedwards --local
        npm run build:stack
        npm run build:content
